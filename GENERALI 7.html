<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GENERALI"><meta name="theme-color" content="#12060a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<title>GENERALI</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#fff;--mut:rgba(255,255,255,.62);--g:#6ee7a0;--y:#ffd45c;--r:#ff8a9a;--red:#e41e33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:#12060a;background-image:radial-gradient(ellipse at 0% 0%,rgba(160,10,30,.85),transparent 48%),radial-gradient(ellipse at 100% 100%,rgba(125,8,24,.6),transparent 48%),radial-gradient(ellipse at 65% 45%,rgba(70,6,16,.55),transparent 62%);background-attachment:fixed;color:var(--ink);font:15px/1.4 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{color:#fff;font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-weight:600;font-size:30px;letter-spacing:-.03em}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02)),rgba(38,12,19,.72);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);border-radius:32px;padding:20px;margin-bottom:16px}
.glass.hot{background:linear-gradient(150deg,#c8102a 0%,#85091a 55%,rgba(38,12,19,.85) 100%);border-color:rgba(255,255,255,.16)}
nav.glass{max-width:100%;overflow-x:auto;display:flex;gap:4px;padding:5px;margin:0 0 0 auto;border-radius:999px;background:rgba(255,255,255,.06)}
nav button{border:0;background:transparent;padding:9px 11px;border-radius:999px;font-family:inherit;font-weight:600;font-size:14px;color:rgba(255,255,255,.75);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--red);color:#fff;box-shadow:0 4px 16px rgba(228,30,51,.45)}
h1{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:0;color:#fff}h2{font-size:18px;font-weight:700;margin:0 0 12px}
.ph{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px}
.plus{width:46px;height:46px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 20px rgba(228,30,51,.5)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.hd h2{margin:0}.hd select,.ph select{width:auto;padding:8px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{border-radius:22px;padding:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}
.hot .kpi{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.14)}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:22px;font-weight:700}
.g{color:var(--g)}.y{color:var(--y)}.r{color:var(--r)}
.sc{overflow-x:auto;margin-top:14px}
table{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:560px}
th{font-size:12px;color:var(--mut);text-align:right;padding:4px 8px;font-weight:600}th:first-child,td:first-child{text-align:left}
td{padding:10px 8px;text-align:right;background:rgba(255,255,255,.06);font-variant-numeric:tabular-nums}
td:first-child{border-radius:14px 0 0 14px;font-weight:600}td:last-child{border-radius:0 14px 14px 0}
tr.al td{background:var(--red);color:#fff;font-weight:600}
details summary{list-style:none;display:flex;justify-content:space-between;cursor:pointer;font-weight:700;font-size:17px}
details summary::-webkit-details-marker{display:none}
.sec{margin-top:14px}.sh{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mut);border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:4px}
.rw{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.rw small{color:var(--mut);display:block}
.ra{font-variant-numeric:tabular-nums;font-weight:700}
input,select,button.pri{font:inherit;padding:12px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);width:100%}
input,select{color:#fff;-webkit-text-fill-color:#fff}option{color:#fff;background:#2a0a10}
input:focus,select:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(228,30,51,.3)}
input::placeholder{color:rgba(255,255,255,.5);-webkit-text-fill-color:rgba(255,255,255,.5)}
button.pri{background:var(--red);color:#fff;border:0;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(228,30,51,.4)}
button.pri.off{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);box-shadow:none}
button.x{border:0;background:none;color:rgba(255,255,255,.85);cursor:pointer;font-size:15px;font-family:inherit}
button.x.ed{color:var(--mut);font-size:17px}
.empty{color:var(--mut);text-align:center;padding:22px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
.ov .glass{width:100%;max-width:420px;margin:0;background:linear-gradient(160deg,#42101a,#1b080c);max-height:100%;overflow:auto}
form{display:grid;gap:10px}label{display:grid;gap:4px;font-size:12px;color:var(--mut)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:7px 13px;background:rgba(255,255,255,.07);font:inherit;font-size:13px;font-weight:600;color:#fff;cursor:pointer}.chip i{width:10px;height:10px;border-radius:50%}.chip.off{opacity:.4}
.pr{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:16px}
</style></head><body><div class="wrap">
<header><div class="brand">GENERALI</div>
<nav class="glass"><button data-p="dash">Dashboard</button><button data-p="mesi">Mesi</button><button data-p="vend">Polizze</button><button data-p="aff">Affiancamenti</button><button data-p="auto">Auto</button></nav></header>
<div id="app"></div></div>
<script>
const SEC=["ANNUI","PROTECTION","UNICI","DNA","DAS","TFR"];
const GOAL={ANNUI:2400,PROTECTION:600,UNICI:15000,DNADAS:800};
const MESI=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const KW=[["TFR",["tfr"]],["DNA",["dna"]],["DAS",["das","tutela legale"]],["UNICI",["unico","unici","una tantum"]],["PROTECTION",["protection","tcm","temporanea","infortun","malattia","salute","ltc","long term","invalidit","vita","cpi","casa","famiglia","rc "]]];
function guess(n){n=" "+n.toLowerCase()+" ";for(const[s,k]of KW)if(k.some(w=>n.includes(w)))return s;return"ANNUI"}
let D={v:[],a:[],p:[]},page="dash",year=new Date().getFullYear(),modal=false;
const openM=new Set();
const nowKey=()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")};
openM.add("v"+nowKey());openM.add("a"+nowKey());
try{const s=localStorage.getItem("cons1");if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
function save(){try{localStorage.setItem("cons1",JSON.stringify(D))}catch(e){}}
const E=n=>(n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toLocaleDateString("sv-SE");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls=(v,g)=>v>=g?"g":v>=g*.75?"y":"r";
const bg=c=>({g:"bg",y:"by",r:"br"}[c]);
const K=()=>({vend:"v",aff:"a",auto:"p"}[page]);
const fd=d=>d.split("-").reverse().join("/");
const vv=x=>x.s==="UNICI"?x.i*.1:x.i;
const pa=(n,per,v,g,x)=>`data-pop='${JSON.stringify([n,per,v,g,x||null])}' style="cursor:pointer"`;
let popup=null,editId=null;
function popHtml(){const[n,per,v,g,x]=popup,d=v-g,c=d>=0?"g":cls(v,g);
 return `<div class="ov" id="pov"><div class="glass"><h2>${n} · ${per}</h2><div class="pr"><span>Obiettivo</span><b>${E(g)}</b></div><div class="pr"><span>Fatto</span><b>${E(v)}</b></div><div class="pr"><span>${d>=0?"In più":"Manca"}</span><b class="${c}">${d>=0?"+":"-"}${E(Math.abs(d))}</b></div>${x?`<div class="pr"><span>DNA</span><b>${E(x[0])}</b></div><div class="pr"><span>DAS</span><b>${E(x[1])}</b></div>`:""}<button class="pri" id="pcx" style="margin-top:14px">Chiudi</button></div></div>`}
function sums(list,pref){const t={};SEC.forEach(s=>t[s]=0);list.filter(x=>x.d.startsWith(pref)).forEach(x=>t[x.s]+=x.i);
 t.DD=t.DNA+t.DAS;t.score=t.ANNUI+t.PROTECTION+t.DNA+t.DAS+t.UNICI*.1;return t}
const SER=[["ANNUI","#ff4d63"],["PROTECTION","#ffc16b"],["UNICI","#ffffff"],["DNA","#ff9bb4"]],chartOff=new Set(["UNICI"]);
const ysel=()=>{const ys=new Set([year,new Date().getFullYear()]);D.v.forEach(x=>ys.add(+x.d.slice(0,4)));return `<select id="ys">${[...ys].sort().map(y=>`<option ${y==year?"selected":""}>${y}</option>`).join("")}</select>`};
const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p};
function chart(){const n=new Date(),cy=n.getFullYear(),last=year<cy?11:year==cy?n.getMonth():-1;
 const ms=MESI.map((_,i)=>sums(D.v,year+"-"+String(i+1).padStart(2,"0"))),get=(s,t)=>s=="DNA"?t.DD:t[s];
 const on=SER.filter(([s])=>!chartOff.has(s));
 let mx=Math.max(0,...on.flatMap(([s])=>ms.slice(0,last+1).map(t=>get(s,t))));mx=mx?nice(mx):100;
 const W=640,H=250,L=56,R=12,Tp=12,B=28,X=i=>L+i*(W-L-R)/11,Y=v=>Tp+(H-Tp-B)*(1-v/mx);
 let g="";for(let k=0;k<=4;k++){const v=mx*k/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.12)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="rgba(255,255,255,.72)">${Math.round(v).toLocaleString("it-IT")}</text>`}
 MESI.forEach((m,i)=>g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.72)">${m.slice(0,3)}</text>`);
 on.forEach(([s,c])=>{const pts=ms.slice(0,last+1).map((t,i)=>[X(i),Y(get(s,t))]);if(!pts.length)return;g+=`<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p.join(",")).join(" ")}"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="${c}" stroke-width="2"/>`).join("")});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Andamento dei rami">${g}</svg><div class="chips">${SER.map(([s,c])=>`<button class="chip${chartOff.has(s)?" off":""}" data-ser="${s}"><i style="background:${c}"></i>${s}</button>`).join("")}</div>`}
function dash(){const n=new Date(),cm=sums(D.v,nowKey());
 const per0=MESI[n.getMonth()]+" "+n.getFullYear(),mk=(a,v,g,x)=>{const c=cls(v,g);return `<div class="kpi" ${pa(a,per0,v,g,x)}><small>${a}</small><b class="${c}">${E(v)}</b></div>`};
 let h=`<div class="glass hot"><h2>${per0}</h2><div class="grid">${mk("ANNUI",cm.ANNUI,GOAL.ANNUI)}${mk("PROTECTION",cm.PROTECTION,GOAL.PROTECTION)}${mk("UNICI",cm.UNICI,GOAL.UNICI)}${mk("DNA",cm.DD,GOAL.DNADAS,[cm.DNA,cm.DAS])}<div class="kpi"><small>Punteggio del mese</small><b>${E(cm.score)}</b></div></div></div>`;
 const T=sums(D.v,String(year)),P=(a,b,g,x)=>`<div class="kpi" ${g?pa(a,String(year),b,g*12,x):""}><small>${a}</small><b>${E(b)}</b></div>`;
 return h+`<div class="glass"><div class="hd"><h2>ANNO</h2>${ysel()}</div><div class="grid">${P("ANNUI",T.ANNUI,GOAL.ANNUI)}${P("PROTECTION",T.PROTECTION,GOAL.PROTECTION)}${P("UNICI",T.UNICI,GOAL.UNICI)}${P("DNA",T.DD,GOAL.DNADAS,[T.DNA,T.DAS])}${P("TFR",T.TFR)}</div><div style="margin-top:16px">${chart()}</div></div>`}
function mesi(){let h=`<div class="ph"><h1>Mesi</h1>${ysel()}</div><div class="glass"><div class="sc" style="margin-top:0"><table><tr><th>Mese</th><th>ANNUI</th><th>PROTECTION</th><th>UNICI</th><th>DNA</th><th>PUNTEGGIO</th></tr>`;
 MESI.forEach((m,i)=>{const t=sums(D.v,year+"-"+String(i+1).padStart(2,"0")),pm=m+" "+year,q=(a,v,g,x)=>`<td ${pa(a,pm,v,g,x)}>${E(v)}</td>`;h+=`<tr><td>${m}</td>${q("ANNUI",t.ANNUI,GOAL.ANNUI)}${q("PROTECTION",t.PROTECTION,GOAL.PROTECTION)}${q("UNICI",t.UNICI,GOAL.UNICI)}${q("DNA",t.DD,GOAL.DNADAS,[t.DNA,t.DAS])}<td><b>${E(t.score)}</b></td></tr>`});
 return h+`</table></div></div>`}
function grouped(key,extra){const L=D[key];
 if(!L.length)return `<div class="glass empty">Ancora nessun inserimento</div>`;
 return [...new Set(L.map(x=>x.d.slice(0,7)))].sort().reverse().map(mk=>{
  const it=L.filter(x=>x.d.startsWith(mk)),[y,m]=mk.split("-");
  return `<details class="glass" data-k="${key+mk}" ${openM.has(key+mk)?"open":""}><summary><span>${MESI[+m-1]} ${y}</span><b>${E(it.reduce((a,x)=>a+vv(x),0))}</b></summary>`+
  SEC.filter(s=>it.some(x=>x.s===s)).map(s=>{const r=it.filter(x=>x.s===s).sort((a,b)=>b.d.localeCompare(a.d));
   return `<div class="sec"><div class="sh"><span>${s}</span><span>${E(r.reduce((a,x)=>a+vv(x),0))}</span></div>`+r.map(x=>`<div class="rw"><div><b>${esc(x.n)}</b><small>${esc(x.cl)}${extra?" · "+esc(x.c):""} · ${fd(x.d)}${x.s==="UNICI"?" · inserito "+E(x.i):""}</small></div><span class="ra">${E(vv(x))}</span><button class="x ed" data-ed="${x.id}">✎</button><button class="x" data-del="${x.id}">✕</button></div>`).join("")+`</div>`}).join("")+`</details>`}).join("")}
function listPage(key,title,extra){return `<div class="ph"><h1>${title}</h1><button class="plus" id="add">+</button></div>`+grouped(key,extra)}
function addYears(d,n){const x=new Date(d);x.setFullYear(x.getFullYear()+n);return x}
function autoPage(){const now=new Date(),lim=new Date(now);lim.setMonth(lim.getMonth()+2);
 const L=D.p.map(x=>({...x,sc:addYears(x.d,1)})).sort((a,b)=>a.sc-b.sc);
 let h=`<div class="ph"><h1>Auto</h1><button class="plus" id="add">+</button></div>`;
 if(!L.length)return h+`<div class="glass empty">Ancora nessuna auto</div>`;
 return h+`<div class="glass"><div class="sc" style="margin-top:0"><table><tr><th>Cliente</th><th>Targa</th><th>Compagnia</th><th>Decorrenza</th><th>Scadenza</th><th>Premio</th><th></th></tr>${L.map(x=>{const red=x.sc<=lim;return `<tr class="${red?"al":""}"><td>${esc(x.cl)}</td><td>${esc(x.t||"")}</td><td>${esc(x.co||"")}</td><td>${fd(x.d)}</td><td>${x.sc.toLocaleDateString("it-IT")}</td><td>${x.i?E(x.i):""}</td><td style="white-space:nowrap"><button class="x ed" data-ed="${x.id}">✎</button><button class="x" data-del="${x.id}">✕</button></td></tr>`}).join("")}</table></div></div>`}
function formHtml(){const k=K(),o=editId?(D[k].find(x=>x.id==editId)||{}):{},vl=f=>o[f]!==undefined?esc(o[f]):"",t=editId?"Modifica":{v:"Nuova polizza",a:"Nuovo affiancamento",p:"Nuova auto"}[k];
 const f=k=="p"?`<input name="cl" placeholder="Cliente" value="${vl("cl")}" required><input name="t" placeholder="Targa" value="${vl("t")}"><input name="co" placeholder="Compagnia" value="${vl("co")}"><label>Decorrenza<input name="d" type="date" value="${o.d||today()}" required></label><input name="i" type="number" step="0.01" min="0" placeholder="Premio €" value="${vl("i")}">`:
 `<input name="n" placeholder="Nome prodotto" value="${vl("n")}" required><select name="s">${SEC.map(s=>`<option ${s==o.s?"selected":""}>${s}</option>`).join("")}</select>${k=="a"?`<input name="c" placeholder="Collaboratore affiancato" value="${vl("c")}" required>`:""}<input name="cl" placeholder="Nome cliente" value="${vl("cl")}" required><label>Data<input name="d" type="date" value="${o.d||today()}" required></label><input name="i" type="number" step="0.01" min="0" placeholder="Importo €" value="${vl("i")}" required>`;
 return `<div class="ov" id="ov"><div class="glass"><h2>${t}</h2><form id="f">${f}<div class="btns"><button type="button" class="pri off" id="cx">Annulla</button><button class="pri">${editId?"Salva":"Aggiungi"}</button></div></form></div></div>`}
function render(){const k=K();
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.p==page));
 document.getElementById("app").innerHTML=(page=="dash"?dash():page=="mesi"?mesi():page=="auto"?autoPage():listPage(k,page=="vend"?"Polizze":"Affiancamenti",page=="aff"))+(modal?formHtml():"")+(popup?popHtml():"");
 const ys=document.getElementById("ys");if(ys)ys.onchange=()=>{year=+ys.value;render()};
 const add=document.getElementById("add");if(add)add.onclick=()=>{editId=null;modal=true;render()};
 document.querySelectorAll("[data-ser]").forEach(b=>b.onclick=()=>{const s=b.dataset.ser;chartOff.has(s)?chartOff.delete(s):chartOff.add(s);render()});
 document.querySelectorAll("[data-pop]").forEach(e=>e.onclick=()=>{popup=JSON.parse(e.dataset.pop);render()});
 const pv=document.getElementById("pov");if(pv){const cp=()=>{popup=null;render()};document.getElementById("pcx").onclick=cp;pv.onclick=e=>{if(e.target===pv)cp()}}
 document.querySelectorAll("details[data-k]").forEach(d=>d.ontoggle=()=>{d.open?openM.add(d.dataset.k):openM.delete(d.dataset.k)});
 const f=document.getElementById("f");
 if(f){const close=()=>{modal=false;editId=null;render()};
  document.getElementById("cx").onclick=close;const ov=document.getElementById("ov");ov.onclick=e=>{if(e.target===ov)close()};
  const s=f.elements.s,n=f.elements.n;let manual=!!editId;
  if(s)s.onchange=()=>manual=true;if(n&&s)n.oninput=()=>{if(!manual)s.value=guess(n.value)};
  f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));v.i=parseFloat(v.i)||0;if(editId){const x=D[k].find(x=>x.id==editId);if(x)Object.assign(x,v)}else{v.id=Date.now()+""+Math.random();D[k].push(v)}if(k!="p")openM.add(k+v.d.slice(0,7));save();modal=false;editId=null;render()};
  const first=f.querySelector("input");if(first)first.focus()}
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(b.dataset.arm){D[k]=D[k].filter(x=>x.id!=b.dataset.del);save();render()}else{b.dataset.arm=1;b.textContent="Elimina?";setTimeout(()=>{delete b.dataset.arm;b.textContent="✕"},3000)}});
 document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{editId=b.dataset.ed;modal=true;render()})}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{page=b.dataset.p;modal=false;render();window.scrollTo(0,0)});
render();
</script></body></html>
